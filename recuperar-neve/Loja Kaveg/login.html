<!doctype html>
<html lang="pt-BR">

<body>
  <header class="hotbar">
    <div class="container hotbar-inner">
      <a class="logo" href="index.html">KVEG</a>
      <nav class="nav">

  </header>

  <main class="container">
    <section class="auth">
      <h1>Entrar</h1>
      <form id="loginForm" class="auth-form" novalidate>
        <label>Email<input type="email" id="loginEmail" required></label>
        <label>Senha<input type="password" id="loginPassword" minlength="6" required></label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Login</button>
        </div>
        <p class="note">Sistema pronto para futura integração com API — atualmente simulação local.</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

        <a href="mailto:suporte@kveg.com" target="_blank" rel="noopener">suporte@kveg.com</a>
        <a href="tel:+5511999999999">(11) 99999-9999</a>

    </div>
